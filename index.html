// ═══════════════════════════════════════════════════
//  🎵 MOTOR D'ÀUDIO 8-BIT (Web Audio API)

let AC = null;

document.getElementById('volBtn').addEventListener('click', ()=>{

function initAC(){
  if(AC) return;
  try{ AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){}
}

// ─── Nota d'oscil·lador ────────────────────────────
function sNote(freq, type, dur, vol, t){
  if(!AC || !soundEnabled || freq<=0) return;
  try{
    const osc = AC.createOscillator();
    const g   = AC.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(vol*masterVol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    osc.connect(g); g.connect(AC.destination);
    osc.start(t); osc.stop(t+dur+0.05);
  }catch(e){}
}

// ─── Soroll blanc filtrat (percussió) ─────────────
function sNoise(dur, vol, cutoff, t){
  if(!AC || !soundEnabled) return;
  try{
    const buf  = AC.createBuffer(1, Math.ceil(AC.sampleRate*Math.max(dur,0.01)), AC.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;
    const src  = AC.createBufferSource();
    src.buffer = buf;
    const flt  = AC.createBiquadFilter();
    flt.type   = 'bandpass';
    flt.frequency.value = cutoff;
    flt.Q.value = 1.5;
    const g = AC.createGain();
    g.gain.setValueAtTime(vol*masterVol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    src.connect(flt); flt.connect(g); g.connect(AC.destination);
    src.start(t); src.stop(t+dur+0.05);
  }catch(e){}
}

// ─── EFECTES DE SO ─────────────────────────────────
const SFX = {

// ─── SEQÜENCIADOR DE MÚSICA 8-BIT ─────────────────
// 140 BPM · pas = nota de 1/16
const BPM  = 140;
const STEP = 60 / (BPM * 4);   // durada d'una semicorxea (≈0.107 s)
const AHEAD = 0.14;             // planifica 140 ms per davant
const TICK  = 28;               // comprova cada 28 ms

// Seqüències de 32 passos (2 compassos de 4/4)
// 0 = silenci, >0 = freqüència en Hz
const SEQ_MEL = [
// Compàs 1 — melodia principal
  784,0,659,0,  784,0,880,0,  784,0,659,0,  587,0,659,0,
// Compàs 2 — resposta
  523,0,659,0,  784,0,0,784,  659,0,587,0,  523,0,0,0,
];
const SEQ_MEL2 = [
// Variació (s'activa a partir del segon loop)
  988,0,784,0,  988,0,1175,0, 988,0,784,0,  659,0,784,0,
  659,0,784,0,  988,0,0,988,  784,0,659,0,  659,0,0,0,
];
const SEQ_BAS = [
  131,0,0,196,  131,0,0,196,  131,0,0,196,  131,0,0,196,
  175,0,0,262,  175,0,0,262,  196,0,0,294,  131,0,0,0,
];
const SEQ_ARP = [
// Arpegi de fons (triangle suau)
  1047,784,659,523, 1047,784,659,523, 1047,784,659,523, 1047,784,659,523,
  698,523,440,349,  698,523,440,349,  784,587,494,392,  784,587,494,392,
];
// K=bombo  S=caixa  H=charles  _=silenci
const SEQ_DRM = [
  'K','_','H','_',  'S','_','H','H',  'K','_','H','_',  'S','_','H','_',
  'K','_','H','_',  'S','_','H','H',  'K','K','H','_',  'S','H','H','H',
];

let loopCount = 0;

function schedStep(t, step){
  const s = step % 32;
  // Melodia (ona quadrada — so clàssic de Gameboy)
  const mel = (loopCount%2===0) ? SEQ_MEL : SEQ_MEL2;
  if(mel[s]>0) sNote(mel[s],'square', STEP*1.7, 0.22, t);
  // Baix (ona quadrada octava inferior)
  if(SEQ_BAS[s]>0) sNote(SEQ_BAS[s],'square', STEP*3.5, 0.14, t);
  // Arpegi (triangle, molt suau de fons)
  if(SEQ_ARP[s]>0) sNote(SEQ_ARP[s],'triangle', STEP*0.65, 0.07, t);
  // Percussió
  const dr = SEQ_DRM[s];
  if(dr==='K'){ sNote(60,'sine',0.14,0.7,t);  sNoise(0.09,0.5,80,t); }
  if(dr==='S'){ sNoise(0.10,0.40,1100,t); sNote(200,'square',0.04,0.15,t); }
  if(dr==='H'){ sNoise(0.03,0.12,9000,t); }
}

function musicSchedule(){
  if(!AC || !musicPlaying) return;
  while(nextNoteTime < AC.currentTime + AHEAD){
    schedStep(nextNoteTime, musicStep);
    nextNoteTime += STEP;
    musicStep++;
    if(musicStep % 32 === 0) loopCount++;
  }
  musicTimer = setTimeout(musicSchedule, TICK);
}

function startMusic(){
  if(!AC || !soundEnabled) return;
  musicPlaying = true;
  musicStep  = 0;
  loopCount  = 0;
  nextNoteTime = AC.currentTime + 0.15;
  clearTimeout(musicTimer);
  musicSchedule();
}

function stopMusic(){
  musicPlaying = false;
  clearTimeout(musicTimer);
  musicTimer = null;
}

// ─── Input ────────────────────────────────────────
function doJump(){
  initAC(); // inicialitza àudio en la primera interacció
  if(G.state==='menu'||G.state==='gameover'){ startGame(); return; }
  if(G.state!=='playing') return;
  const jf = G.superJump>0 ? JUMP_F*1.55 : JUMP_F;
  if(P.onGround){
    P.vy=jf; P.onGround=false; P.jumped=false;
    SFX.jump();
    spawnParts(P.x+P.w/2,P.y+P.h,'#ff69b4',6);
  } else if(!P.jumped&&G.djPow>0){
    P.vy=jf*0.85; P.jumped=true; G.djPow--;
    SFX.dblJump();
    spawnParts(P.x+P.w/2,P.y+P.h/2,'#00eaff',10);
    addMsg("Doble salt! 🏐","#00eaff");
  }
}
document.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();doJump();} });

// ─── Utils ────────────────────────────────────────
function rnd(a,b){ return a+Math.random()*(b-a); }
function collides(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }
function spawnParts(x,y,col,n=8,sp=3){
  for(let i=0;i<n;i++) G.parts.push({x,y,vx:rnd(-sp,sp),vy:rnd(-sp*2,-0.5),life:45+Math.random()*20,col,r:rnd(2,5)});
}

function drawBG(){
  const era=ERAS[G.era];
  const grad=ctx.createLinearGradient(0,0,0,GROUND);
  grad.addColorStop(0,era.s1); grad.addColorStop(1,era.s2);
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,GROUND);
  G.bgStars.forEach(s=>{
    const tw=Math.sin(G.frame/20+s.tw)*0.5+0.5;
    ctx.globalAlpha=0.3+tw*0.7; ctx.fillStyle=era.star;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r*(0.7+tw*0.6),0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
  G.clouds.forEach(c=>{
    ctx.globalAlpha=0.10; ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.ellipse(c.x,c.y,c.w/2,18,0,0,Math.PI*2);
    ctx.ellipse(c.x+20,c.y-10,c.w/3,14,0,0,Math.PI*2);
    ctx.ellipse(c.x-20,c.y-5,c.w/3,13,0,0,Math.PI*2);
    ctx.fill(); ctx.globalAlpha=1;
    c.x-=G.speed*0.25; if(c.x+c.w<0) c.x=W+c.w;
  });
}

function drawGround(){
  const era=ERAS[G.era];
  ctx.fillStyle=era.gCol; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle=era.acc; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
  for(let i=0;i<5;i++){
    const cx=(G.frame*G.speed*0.8+i*200)%(W+100)-50;
    const gr=ctx.createRadialGradient(cx,GROUND,0,cx,GROUND,90);
    gr.addColorStop(0,era.acc+'22'); gr.addColorStop(1,'transparent');
    ctx.fillStyle=gr; ctx.fillRect(cx-90,GROUND-65,180,70);
  }
  const tileW=50, off=G.groundX%tileW;
  ctx.strokeStyle=era.acc+'44'; ctx.lineWidth=1;
  for(let x=-tileW+off;x<W+tileW;x+=tileW){
    ctx.beginPath(); ctx.moveTo(x,GROUND); ctx.lineTo(x,H); ctx.stroke();
  }
}

function drawStar(x,y,r,col){
  ctx.fillStyle=col; ctx.beginPath();
  for(let i=0;i<5;i++){
    const a=i*4*Math.PI/5-Math.PI/2, ai=a+2*Math.PI/5;
    i===0?ctx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r):ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);
    ctx.lineTo(x+Math.cos(ai)*(r*0.38),y+Math.sin(ai)*(r*0.38));
  }
  ctx.closePath(); ctx.fill();
}

function drawAdriana(){
  const x=P.x, y=P.y, t=G.frame;
  const bob=P.onGround?Math.sin(t*0.25)*2:0;
  const lA=P.onGround?Math.sin(t*0.28)*15:(P.vy<0?-22:-8);
  ctx.save();
  if(P.hitF>0&&Math.floor(P.hitF/4)%2===0) ctx.globalAlpha=0.3;
  if(G.shield>0){ctx.shadowColor='#ffd700'; ctx.shadowBlur=22;}
  if(G.superJump>0){ctx.shadowColor='#ffff00'; ctx.shadowBlur=24;}
  // Cames
  [0,1].forEach(i=>{
    ctx.fillStyle='#1a6dc4'; ctx.save();
    ctx.translate(x+(i===0?9:P.w-9),y+P.h-18);
    ctx.rotate((i===0?lA:-lA)*Math.PI/180);
    ctx.fillRect(-6,0,12,22);
    ctx.fillStyle='#e74c3c'; ctx.fillRect(-8,20,16,7);
    ctx.restore();
  });
  // Cos
  const byY=y+22+bob;
  ctx.fillStyle='#1a6dc4';
  ctx.beginPath(); ctx.roundRect(x+2,byY,P.w-4,30,5); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.fillRect(x+7,byY+4,5,22); ctx.fillRect(x+P.w-12,byY+4,5,22);
  ctx.fillStyle='#fff'; ctx.font='bold 12px monospace'; ctx.textAlign='center';
  ctx.fillText('10',x+P.w/2,byY+19);
  // Braços
  const armR=P.onGround?Math.sin(t*0.28+Math.PI)*18:(P.vy<0?-35:-10);
  ctx.fillStyle='#f4c794';
  ctx.save(); ctx.translate(x+3,byY+5); ctx.rotate(armR*Math.PI/180);
  ctx.fillRect(-5,0,10,20); ctx.restore();
  ctx.save(); ctx.translate(x+P.w-3,byY+5); ctx.rotate(-armR*Math.PI/180);
  ctx.fillRect(-5,0,10,20);
  ctx.fillStyle='#fff8e1'; ctx.beginPath(); ctx.arc(0,20,10,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#2980b9'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(0,20,10,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-10,20); ctx.lineTo(10,20); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,20,10,0,Math.PI); ctx.stroke();
  ctx.restore();
  // Cap
  const hY=y+4+bob;
  ctx.fillStyle='#f4c794'; ctx.beginPath(); ctx.arc(x+P.w/2,hY+9,14,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#3d2b1f'; ctx.beginPath(); ctx.arc(x+P.w/2,hY+5,14,Math.PI,0); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x+P.w/2+12,hY+4);
  ctx.quadraticCurveTo(x+P.w/2+24,hY+16+Math.sin(t*0.2)*5,x+P.w/2+17,hY+26+Math.sin(t*0.2)*5);
  ctx.lineWidth=8; ctx.strokeStyle='#3d2b1f'; ctx.stroke();
  ctx.fillStyle='#ff69b4'; ctx.beginPath(); ctx.arc(x+P.w/2+13,hY+5,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#333';
  ctx.beginPath(); ctx.arc(x+P.w/2-5,hY+9,2.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+P.w/2+5,hY+9,2.5,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#b06050'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(x+P.w/2,hY+12,4.5,0.2,Math.PI-0.2); ctx.stroke();
  if(G.shield>0){ for(let i=0;i<3;i++){ const a=t*0.08+i*2.09; drawStar(x+P.w/2+Math.cos(a)*30,hY+Math.sin(a)*24,6,'#ffd700'); }}
  if(G.superJump>0){ for(let i=0;i<4;i++){ const a=t*0.12+i*1.57; drawStar(x+P.w/2+Math.cos(a)*32,hY+Math.sin(a)*25,5,'#ffff00'); }}
  ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.restore();
}

function drawSongBadge(cx,topY,song,band,col){
  ctx.save();
  ctx.font='bold 13px monospace'; ctx.textAlign='center';
  ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=10;
  ctx.fillText(band,cx,topY-26); ctx.shadowBlur=0;
  const sw=ctx.measureText(song).width+22;
  ctx.fillStyle='rgba(0,0,0,0.78)';
  ctx.beginPath(); ctx.roundRect(cx-sw/2,topY-20,sw,18,5); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 12px monospace';
  ctx.fillText(song,cx,topY-6);
  ctx.restore();
}

function drawObstacle(o){
  ctx.save();
  switch(o.t){
    case 'guitar':  drawGuitar(o);      break;
    case 'mic':     drawMic(o);         break;
    case 'heart':   drawBrokenHeart(o); break;
    case 'speaker': drawSpeaker(o);     break;
    case 'net':     drawNet(o);         break;
    case 'vinyl':   drawVinyl(o);       break;
  }
  ctx.restore();
  drawSongBadge(o.x+o.w/2,o.y,o.song,o.band,o.col);
}

function drawGuitar(o){
  const {x,y,w,h}=o;
  ctx.fillStyle='#5c2a00'; ctx.fillRect(x+w/2-5,y,10,h*0.55);
  ctx.fillStyle='#ff4500'; ctx.beginPath(); ctx.ellipse(x+w/2,y+h*0.75,w/2,h*0.28,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.arc(x+w/2,y+h*0.75,8,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#ffd700'; ctx.lineWidth=1.5;
  for(let i=0;i<3;i++){ const sx=x+w/2-4+i*4; ctx.beginPath(); ctx.moveTo(sx,y+5); ctx.lineTo(sx,y+h*0.6); ctx.stroke(); }
  ctx.fillStyle='#ff6622'; ctx.fillRect(x+w/2-7,y,14,12);
}
function drawMic(o){
  const {x,y,w,h}=o;
  ctx.fillStyle='#bbb'; ctx.fillRect(x+w/2-3,y+28,6,h-28);
  ctx.fillStyle='#777'; ctx.fillRect(x+w/2-13,y+h-8,26,8);
  ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(x+w/2,y+14,15,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#aaa'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x+w/2,y+14,15,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=1;
  for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(x+w/2-15,y+7+i*6); ctx.lineTo(x+w/2+15,y+7+i*6); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(x+w/2,y); ctx.lineTo(x+w/2,y+28); ctx.stroke();
  drawStar(x+w/2-18,y+12,6,'#ffd700'); drawStar(x+w/2+18,y+12,6,'#ffd700');
  ctx.fillStyle='#fff'; ctx.font='bold 9px monospace'; ctx.textAlign='center'; ctx.fillText('TS',x+w/2,y+18);
}
function drawBrokenHeart(o){
  const {x,y,w,h}=o; const hx=x+w/2, hy=y+h/2;
  ctx.fillStyle='#7d3099';
  ctx.beginPath(); ctx.moveTo(hx,hy+h*0.32);
  ctx.bezierCurveTo(hx-w*0.52,hy,hx-w*0.52,hy-h*0.26,hx-w*0.16,hy-h*0.32);
  ctx.bezierCurveTo(hx-w*0.06,hy-h*0.36,hx,hy-h*0.22,hx,hy); ctx.fill();
  ctx.fillStyle='#9b59b6';
  ctx.beginPath(); ctx.moveTo(hx,hy+h*0.32);
  ctx.bezierCurveTo(hx+w*0.52,hy,hx+w*0.52,hy-h*0.26,hx+w*0.16,hy-h*0.32);
  ctx.bezierCurveTo(hx+w*0.06,hy-h*0.36,hx,hy-h*0.22,hx,hy); ctx.fill();
  ctx.fillStyle='#ffd700';
  ctx.beginPath(); ctx.moveTo(hx,hy-h*0.37); ctx.lineTo(hx-7,hy); ctx.lineTo(hx+3,hy);
  ctx.lineTo(hx-5,hy+h*0.35); ctx.lineTo(hx+2,hy); ctx.lineTo(hx+7,hy-h*0.1);
  ctx.lineTo(hx,hy-h*0.1); ctx.closePath(); ctx.fill();
}
function drawSpeaker(o){
  const {x,y,w,h}=o;
  ctx.fillStyle='#1d6a38'; ctx.beginPath(); ctx.roundRect(x,y,w,h,5); ctx.fill();
  ctx.strokeStyle='#27ae60'; ctx.lineWidth=2; ctx.beginPath(); ctx.roundRect(x+2,y+2,w-4,h-4,4); ctx.stroke();
  ctx.fillStyle='#0d3320'; ctx.beginPath(); ctx.arc(x+w/2,y+h*0.44,24,0,Math.PI*2); ctx.fill();
  for(let r=5;r<=22;r+=5){ ctx.strokeStyle='rgba(39,174,96,0.35)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(x+w/2,y+h*0.44,r,0,Math.PI*2); ctx.stroke(); }
  for(let i=1;i<=3;i++){ ctx.strokeStyle=`rgba(39,174,96,${0.55-i*0.14})`; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(x+w+6,y+h*0.44,i*11,-Math.PI*0.5,Math.PI*0.5); ctx.stroke(); }
  ctx.fillStyle='#ffd700'; ctx.font='bold 9px monospace'; ctx.textAlign='center'; ctx.fillText('LA FUMIGA',x+w/2,y+h-8);
}
function drawNet(o){
  const {x,y,w,h}=o;
  ctx.fillStyle='#777'; ctx.fillRect(x,y,5,h); ctx.fillRect(x+w-5,y,5,h);
  ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1.5;
  for(let r=0;r<=5;r++){ ctx.beginPath(); ctx.moveTo(x,y+r*h/5); ctx.lineTo(x+w,y+r*h/5); ctx.stroke(); }
  for(let c=0;c<=8;c++){ ctx.beginPath(); ctx.moveTo(x+c*w/8,y); ctx.lineTo(x+c*w/8,y+h); ctx.stroke(); }
  const vx=x+w/2, vy=y-18;
  ctx.fillStyle='#fff8e1'; ctx.beginPath(); ctx.arc(vx,vy,13,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#2980b9'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(vx,vy,13,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(vx-13,vy); ctx.lineTo(vx+13,vy); ctx.stroke();
  ctx.beginPath(); ctx.arc(vx,vy,13,0,Math.PI); ctx.stroke();
}
function drawVinyl(o){
  const {x,y,w,h}=o; const cx=x+w/2, cy=y+h/2, R=w/2;
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();
  for(let r=R*0.35;r<=R*0.92;r+=3){ ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke(); }
  ctx.fillStyle='#e74c3c'; ctx.beginPath(); ctx.arc(cx,cy,R*0.3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 8px monospace'; ctx.textAlign='center'; ctx.fillText('VINYL',cx,cy+3);
  const ang=G.frame*0.08;
  ctx.strokeStyle='rgba(255,255,255,0.12)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(ang)*R,cy+Math.sin(ang)*R); ctx.stroke();
}

function drawPowerUp(p){
  const {x,y,w,h,t}=p; const pulse=1+Math.sin(G.frame*0.14)*0.12;
  ctx.save(); ctx.translate(x+w/2,y+h/2); ctx.scale(pulse,pulse);
  if(t==='star'){ drawStar(0,0,16,'#ffd700'); ctx.fillStyle='#fffde7'; ctx.font='bold 10px monospace'; ctx.textAlign='center'; ctx.fillText('TS',0,4); }
  else if(t==='ball'){
    ctx.fillStyle='#fff8e1'; ctx.beginPath(); ctx.arc(0,0,14,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#2980b9'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,14,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-14,0); ctx.lineTo(14,0); ctx.stroke();

function drawPaco(pac){
  const {x,y,w,h,pow}=pac;
  pac.bob=(pac.bob||0)+0.1;
  const bobY=Math.sin(pac.bob)*7;
  const cx=x+w/2, cy=y+h/2+bobY;
  ctx.save(); ctx.shadowColor=pow.col; ctx.shadowBlur=26;
  // Cos taronja
  ctx.fillStyle='#e67e22'; ctx.beginPath(); ctx.roundRect(cx-14,cy-12,28,34,5); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.2)';
  for(let i=0;i<4;i++) ctx.fillRect(cx-14+i*7,cy-12,3,34);
  // Cames
  ctx.fillStyle='#1a5276'; ctx.fillRect(cx-12,cy+22,10,20); ctx.fillRect(cx+2,cy+22,10,20);
  ctx.fillStyle='#111'; ctx.fillRect(cx-14,cy+40,13,8); ctx.fillRect(cx+1,cy+40,13,8);
  // Braços
  const ab=Math.sin(pac.bob*2)*14;
  ctx.fillStyle='#f4c794';
  ctx.save(); ctx.translate(cx-14,cy-6); ctx.rotate(-ab*Math.PI/180); ctx.fillRect(-10,0,10,22); ctx.restore();
  ctx.save(); ctx.translate(cx+14,cy-6); ctx.rotate(ab*Math.PI/180); ctx.fillRect(0,0,10,22); ctx.restore();
  // Cap
  ctx.fillStyle='#f4c794'; ctx.beginPath(); ctx.arc(cx,cy-24,16,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2c1a0e'; ctx.beginPath(); ctx.arc(cx,cy-32,16,Math.PI,0); ctx.fill();
  ctx.fillRect(cx-16,cy-35,32,12);
  // BIGOT (icònic!)
  ctx.fillStyle='#1a0a00';
  ctx.beginPath();
  ctx.moveTo(cx-15,cy-20); ctx.quadraticCurveTo(cx-6,cy-13,cx,cy-17);
  ctx.quadraticCurveTo(cx+6,cy-13,cx+15,cy-20);
  ctx.quadraticCurveTo(cx+10,cy-15,cx,cy-17);
  ctx.quadraticCurveTo(cx-10,cy-15,cx-15,cy-20); ctx.fill();
  // Ulls
  ctx.fillStyle='#333';
  ctx.beginPath(); ctx.arc(cx-6,cy-26,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+6,cy-26,3,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#1a0a00'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(cx-11,cy-31); ctx.lineTo(cx-2,cy-30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+11,cy-31); ctx.lineTo(cx+2,cy-30); ctx.stroke();
  ctx.shadowBlur=0;
  // Badge
  ctx.fillStyle='#e74c3c'; ctx.beginPath(); ctx.roundRect(cx-30,cy+46,60,22,6); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 12px monospace'; ctx.textAlign='center'; ctx.fillText('EL PACO',cx,cy+61);
  // Bomboleta
  const bw=172, bh=56, bxL=cx+28;
  ctx.fillStyle='#ffffffee'; ctx.strokeStyle=pow.col; ctx.lineWidth=3;
  ctx.beginPath(); ctx.roundRect(bxL,cy-54,bw,bh,10); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bxL+4,cy-24); ctx.lineTo(cx+18,cy-8); ctx.lineTo(bxL+18,cy-24); ctx.fill(); ctx.stroke();
  ctx.fillStyle=pow.col; ctx.font='bold 17px monospace'; ctx.textAlign='center';
  ctx.fillText(pow.emoji,bxL+bw/2,cy-34);
  ctx.fillStyle='#222'; ctx.font='bold 11px monospace';
  ctx.fillText(pow.name,bxL+bw/2,cy-14);
  if(G.frame%8===0) spawnParts(cx+rnd(-22,22),cy+rnd(-32,32),pow.col,2,1.5);
  ctx.restore();
}

function drawPrima(){
  if(!G.primaAnim) return;
  const {who,msg,life,maxLife}=G.primaAnim;
  const alpha=life>maxLife*0.85?(maxLife-life)/(maxLife*0.15):life<maxLife*0.2?life/(maxLife*0.2):1;
  const side=who==='empar'?0:1, px=side===0?65:W-65, py=170;
  ctx.save(); ctx.globalAlpha=alpha;
  const bw=180, bh=68, bxOff=side===0?8:-bw-8;
  ctx.fillStyle='#fff'; ctx.strokeStyle=who==='empar'?'#ff69b4':'#9b59b6'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.roundRect(px+bxOff,py-bh-8,bw,bh,12); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(px+(side===0?12:-12),py-16); ctx.lineTo(px,py+2); ctx.lineTo(px+(side===0?26:-4),py-16); ctx.fill(); ctx.stroke();
  const bmx=px+bxOff+bw/2;
  ctx.fillStyle=who==='empar'?'#ff69b4':'#9b59b6'; ctx.font='bold 13px monospace'; ctx.textAlign='center';
  ctx.fillText(who==='empar'?'EMPAR':'CARME',bmx,py-bh+22);
  ctx.fillStyle='#333'; ctx.font='11px monospace';
  const words=msg.split(' '); let line='', lY=py-bh+42;
  words.forEach(wd=>{ if((line+wd).length>16){ctx.fillText(line.trim(),bmx,lY);line=wd+' ';lY+=15;}else line+=wd+' '; });
  ctx.fillText(line.trim(),bmx,lY);
  ctx.fillStyle=who==='empar'?'#f9c784':'#f4c794';
  ctx.beginPath(); ctx.arc(px,py+22,19,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=who==='empar'?'#ff69b4':'#9b59b6'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(px,py+22,19,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle=who==='empar'?'#7a2a00':'#2c1a0e';
  ctx.beginPath(); ctx.arc(px,py+12,19,Math.PI*0.9,Math.PI*0.1); ctx.fill();
  ctx.fillStyle='#333';
  ctx.beginPath(); ctx.arc(px-6,py+21,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(px+6,py+21,3,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#b06050'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(px,py+26,5,0.2,Math.PI-0.2); ctx.stroke();
  ctx.fillStyle=who==='empar'?'#ff69b4':'#9b59b6';
  ctx.beginPath(); ctx.roundRect(px-24,py+44,48,18,6); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 10px monospace'; ctx.textAlign='center';
  ctx.fillText(who==='empar'?'EMPAR':'CARME',px,py+56);
  ctx.restore();
}

function updateDrawMsgs(){
  G.floatMsgs=G.floatMsgs.filter(m=>m.life>0);
  G.floatMsgs.forEach(m=>{
    m.y-=0.55; m.life--; m.alpha=m.life/115;
    ctx.save(); ctx.globalAlpha=m.alpha;
    ctx.fillStyle=m.col; ctx.font='bold 19px monospace'; ctx.textAlign='center';
    ctx.shadowColor=m.col; ctx.shadowBlur=14;
    ctx.fillText(m.txt,m.x,m.y); ctx.restore();
  });
}

function updateDrawParts(){
  G.parts=G.parts.filter(p=>p.life>0);
  G.parts.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.14; p.life--;
    ctx.globalAlpha=p.life/65; ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
  });
}

function drawMenu(){

  ctx.fillText("Primes: Empar & Carme  |  El PACO 🧔",W/2,H/2-8);
  // Indicador de música
  ctx.fillStyle='#ffd700'; ctx.font='bold 11px monospace';
  ctx.fillText('🎵 MUSICA 8-BIT ACTIVADA! Usa el boto SO per a canviar.',W/2,H/2+16);
  // Botó
  const pulse=1+Math.sin(G.frame*0.06)*0.05;
  ctx.save(); ctx.translate(W/2,H/2+48); ctx.scale(pulse,pulse);
  ctx.fillStyle='#ff69b4'; ctx.beginPath(); ctx.roundRect(-135,-28,270,56,28); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 17px monospace'; ctx.textAlign='center';
  ctx.fillText('CLICK / ESPAI / TAP',0,8); ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.75)'; ctx.font='12px monospace'; ctx.textAlign='center';
  ctx.fillText('Salta per a esquivar!  Aplega el PACO 🧔',W/2,H/2+96);
  ctx.fillText('per a tindre superpoderes!',W/2,H/2+114);
  for(let i=0;i<6;i++){
    const ang=G.frame*0.022+i*Math.PI/3;
    drawStar(W/2+Math.cos(ang)*210,H/2-52+Math.sin(ang*1.3)*58,6+Math.sin(G.frame*0.05+i)*2,'#ffd700');
  }
}

function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,0.88)'; ctx.fillRect(0,0,W,H);
  const newHi=G.score>G.hiScore;
  ctx.fillStyle='#ff3333'; ctx.font='bold 36px monospace'; ctx.textAlign='center';
  ctx.shadowColor='#ff0000'; ctx.shadowBlur=20;
  ctx.fillText('GAME OVER',W/2,H/2-82); ctx.shadowBlur=0;
  if(newHi){ ctx.fillStyle='#ffd700'; ctx.font='bold 20px monospace'; ctx.fillText('NOU RECORD! ⭐',W/2,H/2-48); }
  ctx.fillStyle='#fff'; ctx.font='bold 17px monospace';
  ctx.fillText(`PUNTUACIO: ${Math.floor(G.score)}`,W/2,H/2-14);
  ctx.fillStyle='#bbb'; ctx.font='14px monospace';
  ctx.fillText(`MAXIM: ${Math.floor(Math.max(G.score,G.hiScore))}`,W/2,H/2+6);
  const pulse=1+Math.sin(G.frame*0.08)*0.05;
  ctx.save(); ctx.translate(W/2,H/2+55); ctx.scale(pulse,pulse);
  ctx.fillStyle='#ff69b4'; ctx.beginPath(); ctx.roundRect(-125,-26,250,52,26); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 15px monospace'; ctx.textAlign='center';
  ctx.fillText('TORNAR A JUGAR',0,7); ctx.restore();
  const quotes=["Shake it off! 🎵","Drivers License? Ella CORRE!","La Fumiga et crida! 🎶","Hinds: you can do it! 🎸","Cruel Summer? No, VICTORIA!","El Paco tornara! 🧔"];
  ctx.fillStyle='rgba(255,105,180,0.6)'; ctx.font='12px monospace';
  ctx.fillText(quotes[Math.floor(G.score/50)%quotes.length],W/2,H/2+100);
}

// ══════════════════════════════════════════════════
//  UPDATE
// ══════════════════════════════════════════════════
function checkMilestones(){
  [100,200,300,500,750,1000,1500,2000].forEach(m=>{
    if(G.score>=m&&!G.milestones.has(m)){
      G.milestones.add(m);
      SFX.milestone();
      addMsg(MSGS[Math.floor(Math.random()*MSGS.length)],'#ffd700');
      spawnParts(W/2,H/2,'#ff69b4',22,5); spawnParts(W/2,H/2,'#ffd700',22,5);
    }
  });
}

function update(){
  if(G.state!=='playing') return;
  G.frame++;
  // Timers de poders
  if(G.superJump>0) G.superJump--;
  if(G.slowmo>0) G.slowmo--;
  if(G.turbo>0) G.turbo--;
  if(G.scoreMultiTimer>0) G.scoreMultiTimer--; else G.scoreMulti=1;
  if(G.shield>0) G.shield--;

  const spd = G.slowmo>0 ? G.speed*0.35 : (G.turbo>0 ? G.speed*1.6 : G.speed);
  G.score += spd*0.06*G.scoreMulti;
  G.speed = BASE_SPD + G.score*0.003;
  G.groundX = (G.groundX-spd)%50;
  G.eraTick++;
  if(G.eraTick>650){
    G.eraTick=0; G.era=(G.era+1)%ERAS.length;
    SFX.eraChange();
    addMsg("Nova era! "+ERAS[G.era].name,'#ff69b4');
  }

  // Física jugadora
  P.vy+=GRAVITY; P.y+=P.vy;
  if(P.y>=GROUND){ P.y=GROUND; P.vy=0; P.onGround=true; P.jumped=false; }
  else P.onGround=false;
  if(P.hitF>0) P.hitF--;
  if(P.invF>0) P.invF--;
  if(G.shakeX>0) G.shakeX=Math.max(0,G.shakeX-1);

  // Spawn
  G.nextObs--; if(G.nextObs<=0){ spawnObs(); G.nextObs=Math.max(55,Math.floor(rnd(100,190)-G.speed*3)); }
  G.nextPup--;  if(G.nextPup<=0){ spawnPup(); G.nextPup=Math.floor(rnd(260,430)); }
  G.nextPaco--; if(G.nextPaco<=0){ spawnPaco(); G.nextPaco=Math.floor(rnd(700,1200)); }

  G.obs.forEach(o=>o.x-=spd); G.obs=G.obs.filter(o=>o.x+o.w>0);
  G.pups.forEach(p=>p.x-=spd); G.pups=G.pups.filter(p=>p.x+p.w>0);
  G.pacos.forEach(pac=>pac.x-=spd*0.85); G.pacos=G.pacos.filter(pac=>pac.x+pac.w>0);

  // Col·lisions
  const ph={x:P.x+5,y:P.y+5,w:P.w-10,h:P.h-10};
  G.obs.forEach(o=>{
    if(G.shield>0||P.invF>0) return;
    if(collides(ph,{x:o.x+3,y:o.y+3,w:o.w-6,h:o.h-6})){
      G.lives--; P.hitF=60; P.invF=90; G.shakeX=14;
      SFX.hit();
      spawnParts(P.x+P.w/2,P.y+P.h/2,'#ff4444',16);
      addMsg(`💥 ${o.song}! Aix!`,'#ff4444');
      if(G.lives<=0){
        G.hiScore=Math.max(G.hiScore,G.score);
        G.state='gameover';
        stopMusic();
        SFX.gameover();
      }
    }
  });
  G.pups=G.pups.filter(p=>{
    if(!collides(ph,{x:p.x,y:p.y,w:p.w,h:p.h})) return true;
    SFX.powerup(); spawnParts(p.x+p.w/2,p.y+p.h/2,p.col,14);
    if(p.effect==='shield'){ G.shield=300; addMsg('⭐ Escut de Taylor! 5 seg!','#ffd700'); }
    else if(p.effect==='dj'){ G.djPow=Math.min(G.djPow+1,3); addMsg('🏐 Doble salt!','#00eaff'); }
    else if(p.effect==='life'){ G.lives=Math.min(G.lives+1,5); addMsg('💖 +1 VIDA!','#ff69b4'); }
    return false;
  });
  G.pacos=G.pacos.filter(pac=>{
    if(!collides(ph,{x:pac.x,y:pac.y,w:pac.w,h:pac.h})) return true;
    pac.pow.apply();
    SFX.paco();
    spawnParts(pac.x+pac.w/2,pac.y+pac.h/2,pac.pow.col,30,5);
    spawnParts(pac.x+pac.w/2,pac.y+pac.h/2,'#ffd700',20,6);
    return false;
  });
  G.primaCooldown--;
  if(G.primaCooldown<=0){
    G.primaCooldown=Math.floor(rnd(520,920));
    const who=Math.random()<0.5?'empar':'carme';
    const msgs=PRIMA_MSGS[who];
    G.primaAnim={who,msg:msgs[Math.floor(Math.random()*msgs.length)],life:220,maxLife:220};
  }
  if(G.primaAnim){ G.primaAnim.life--; if(G.primaAnim.life<=0) G.primaAnim=null; }
  checkMilestones();
}

// ══════════════════════════════════════════════════
//  RENDER + LOOP
// ══════════════════════════════════════════════════
function render(){
  ctx.clearRect(0,0,W,H);
  if(G.shakeX>0){ ctx.save(); ctx.translate(rnd(-G.shakeX,G.shakeX),rnd(-G.shakeX/2,G.shakeX/2)); }
  drawBG(); drawGround();
  if(G.state==='playing'||G.state==='gameover'){
    G.obs.forEach(o=>drawObstacle(o));
    G.pups.forEach(p=>drawPowerUp(p));
    G.pacos.forEach(pac=>drawPaco(pac));
    drawAdriana();
    updateDrawParts(); updateDrawMsgs();
    if(G.primaAnim) drawPrima();
    if(G.state==='playing') drawHUD();
    if(G.state==='gameover') drawGameOver();
  }
  if(G.state==='menu'){ drawAdriana(); drawMenu(); }
  if(G.shakeX>0) ctx.restore();
}

function loop(){ update(); render(); requestAnimationFrame(loop); }
resetPlayer(); G.state='menu'; loop();
</script>
